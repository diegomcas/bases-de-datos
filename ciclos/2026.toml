  titulo = "Del modelo conceptual a la tabla"
  nota = "Las dos clases van juntas: primero se dibuja el DER y enseguida se lo convierte en tablas. Separarlas hacía perder el hilo."
  materiales = ["modelado-conceptual-el-der", "del-dibujo-a-la-tabla"]

[[unidad]]
id = "u3"
numero = "III"
