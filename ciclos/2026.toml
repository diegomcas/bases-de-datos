subtitulo = "Por qué existe una base de datos"
rango = "Clases 1 a 4"
color = "bloque-azul"
trimestre = "t1"
intro = "Antes de modelar nada hay que entender qué problema resuelve una base de datos y qué se rompe cuando no la hay. Es la unidad más conceptual del año."

