rango = "Clases 5 a 7"
color = "bloque-verde"
trimestre = "t1"
intro = "El recorrido central del primer trimestre: alguien te cuenta un problema y tenés que llegar a un conjunto de tablas que lo represente sin perder nada y sin repetir nada. El modelado avanzado y la auditoría entre pares no son un tema aparte: se practican durante todo el año, cada vez que aparecen."

  [[unidad.clase]]
  numero = "Clase 5"
  titulo = "Ingeniería de requerimientos"
  materiales = ["relevar-y-clasificar-requerimientos", "presentacion-de-la-clase"]

