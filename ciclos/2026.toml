  titulo = "El primer cliente real"
  nota = "Acá entra El Chip y con él la pregunta que ordena el resto del año: cómo se pasa de lo que alguien cuenta a algo que se puede modelar."
  materiales = ["caso-de-estudio-el-chip", "como-entrevistar-a-un-cliente"]

[[unidad]]
id = "u2"
