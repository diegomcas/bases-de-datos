  numero = "Clases 13 y 14"
  titulo = "Álgebra relacional"
  mencion = "<strong>Se nombra, no se desarrolla.</strong> Es contenido avanzado y rompe el ritmo del taller. Los conceptos —selección, proyección, producto cartesiano— aparecen igual, pero en su forma práctica, cuando llegamos a las uniones en SQL."
  materiales = []

  [[unidad.clase]]
  numero = "Clases 15 a 18"
  titulo = "Normalización"
  nota = "De la planilla de Excel de Martín a un modelo en tercera forma normal: 1FN, dependencias funcionales, 2FN, 3FN y BCNF."
  materiales = ["normalizacion-de-1fn-a-bcnf", "demo-en-vivo"]

  [[unidad.clase]]
  numero = "Clase 21"
  titulo = "Desnormalización y rendimiento"
  pendientes = ["Cuándo conviene romper a propósito una forma normal<em>en preparación</em>"]
  materiales = []

