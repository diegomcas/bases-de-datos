color = "bloque-naranja"
trimestre = "t2"
intro = "La unidad más teórica y la que más cambia la forma de mirar una tabla. Arranca con Codd y termina cuando podés justificar, con un argumento y no con una intuición, por qué un diseño es mejor que otro."

  [[unidad.clase]]
  numero = "Clase 12"
  titulo = "Las reglas de Edgar Codd"
  materiales = ["modelo-relacional-e-integridad-referencial"]

